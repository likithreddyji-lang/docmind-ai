# Dev Profile configuration
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:docmind}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

  ai:
    retry:
      max-attempts: 5
      backoff:
        initial-interval: 2000ms
        multiplier: 2.0
      on-http-codes:
        - 429
        - 500
        - 503
    openai:
      api-key: ${GEMINI_API_KEY}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      chat:
        completions-path: /chat/completions
        options:
          model: ${GEMINI_CHAT_MODEL:gemini-3.5-flash}
          temperature: 0.2
      embedding:
        options:
          model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 50MB

server:
  port: ${PORT:8081}

app:
  rag:
    chunk-size: 400
    top-k: 5
    similarity-threshold: 0.0

  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173,http://localhost:3000}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: INFO
        retry: INFO
